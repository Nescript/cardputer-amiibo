[platformio]
default_envs = m5stack-stamps3

[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200

extra_scripts = pre:tools/git_version.py

build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17

lib_deps =
    m5stack/M5Unified @ ^0.2.2
    m5stack/M5Cardputer @ ^1.1.1

lib_ignore =
    LibSSH-ESP32
    IRremote

build_src_filter = +<*> -<ns2/> -<usb_switch2.cpp>

[env:m5stack-stamps3-switch2]
extends = env:m5stack-stamps3
build_flags =
    ${env:m5stack-stamps3.build_flags}
    -DAMIIBO_SWITCH2
    -Iinclude/ns2
build_src_filter = +<*> -<usb_switch_hid.cpp>
